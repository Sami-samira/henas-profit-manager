<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><title>مدیر سود کافه هناس</title><style>
:root{--bg:#171717;--p:#242424;--p2:#303030;--t:#eee;--m:#aaa;--l:#464646;--g:#779a6d;--r:#c96b6b;--o:#c89550}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Vazirmatn,Tahoma,Arial,sans-serif;padding-bottom:70px}header{position:sticky;top:0;z-index:9;background:#101010;padding:14px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}small{color:var(--m)}button,input,select{font:inherit}button{border:1px solid #555;background:#111;color:#eee;border-radius:11px;padding:9px 12px;cursor:pointer}main{max-width:1300px;margin:auto;padding:15px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button.active{background:#444}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:15px}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}.kpi b{font-size:25px;display:block;margin-top:8px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}label{font-size:12px;color:#ccc;display:block;margin-bottom:5px}input,select{width:100%;padding:10px;background:#181818;color:#eee;border:1px solid #555;border-radius:10px}.act{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.good{background:#30402f}.bad{background:#4b2828}.warn{background:#4b3924}.table{overflow:auto;max-height:430px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:9px;border-bottom:1px solid #444}th{background:#303030}.sug{background:#191919;border-right:4px solid #777;padding:12px;border-radius:10px;margin:8px 0;line-height:1.8}.sug.high{border-color:var(--r)}.sug.med{border-color:var(--o)}.sug.low{border-color:var(--g)}.green{color:#a8c79e}.red{color:#e28a8a}.badge{padding:3px 8px;border-radius:12px;background:#444}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:20;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal>div{background:#252525;border:1px solid #555;border-radius:15px;padding:16px;width:min(700px,100%);max-height:90vh;overflow:auto}.rr{display:grid;grid-template-columns:2fr 1fr auto;gap:7px;margin:7px 0}@media(max-width:800px){.s3,.s4,.s6,.s8{grid-column:span 12}.form{grid-template-columns:1fr 1fr}}@media(max-width:520px){.form{grid-template-columns:1fr}.tabs{position:fixed;bottom:0;left:0;right:0;background:#111;padding:7px;margin:0;z-index:10}.tabs button{flex:1;font-size:10px;padding:9px 4px}header small{display:none}}
</style></head><body><header><div><h1>مدیر سود کافه هناس</h1><small>تصمیم‌یار مالی و عملیاتی</small></div><div><button id="install" hidden>نصب اپ</button><button onclick="backup()">پشتیبان</button><label style="display:inline"><button onclick="this.nextElementSibling.click()">بازیابی</button><input hidden type="file" accept=".json" onchange="restore(event)"></label></div></header><main><div class="tabs" id="tabs"></div>
<section class="page active" id="dashboard"><div class="grid"><div class="card kpi s3">فروش ماه<b id="sales">۰</b></div><div class="card kpi s3">سود ناخالص<b id="gross">۰</b></div><div class="card kpi s3">سود خالص<b id="net">۰</b></div><div class="card kpi s3">حاشیه سود<b id="margin">۰٪</b></div><div class="card s8"><h2>پیشنهادهای هوشمند</h2><div id="suggestions"></div></div><div class="card s4"><h2>هدف سود</h2><label>سود هدف ماهانه</label><input id="target" type="number" onchange="settings()"><label>روز کاری</label><input id="days" type="number" onchange="settings()"><p>فاصله تا هدف: <b id="gap"></b></p><p>فروش اضافه روزانه: <b id="daily"></b></p></div></div></section>
<section class="page" id="ingredients"><div class="card"><h2>مواد اولیه</h2><div class="form"><div><label>نام ماده</label><input id="in"></div><div><label>قیمت بسته</label><input id="ip" type="number"></div><div><label>مقدار بسته</label><input id="iq" type="number"></div><div><label>واحد</label><select id="iu"><option>گرم</option><option>میلی‌لیتر</option><option>عدد</option></select></div></div><div class="act"><button class="good" onclick="addIng()">ثبت ماده</button></div><div class="table"><table id="it"></table></div></div></section>
<section class="page" id="products"><div class="card"><h2>محصولات و رسپی</h2><div class="form"><div><label>نام محصول</label><input id="pn"></div><div><label>قیمت فروش</label><input id="pp" type="number"></div><div><label>تعداد فروش ماه</label><input id="pq" type="number"></div><div><label>بسته‌بندی هر سرو</label><input id="pc" type="number" value="0"></div></div><div class="act"><button class="good" onclick="openRecipe()">تعریف رسپی و ثبت</button></div><div class="table"><table id="pt"></table></div></div></section>
<section class="page" id="expenses"><div class="grid"><div class="card s6"><h2>هزینه‌ها</h2><div class="form" style="grid-template-columns:2fr 1fr 1fr"><div><label>عنوان</label><input id="en"></div><div><label>مبلغ</label><input id="ea" type="number"></div><div><label>نوع</label><select id="et"><option>ثابت</option><option>متغیر</option></select></div></div><div class="act"><button class="good" onclick="addExp()">ثبت</button></div><div class="table"><table id="ext"></table></div></div><div class="card s6"><h2>پرت</h2><div class="form" style="grid-template-columns:2fr 1fr"><div><label>ماده</label><select id="wi"></select></div><div><label>مقدار پرت</label><input id="wq" type="number"></div></div><div class="act"><button class="good" onclick="addWaste()">ثبت</button></div><div class="table"><table id="wt"></table></div></div></div></section>
<section class="page" id="inventory"><div class="card"><h2>موجودی و پیشنهاد خرید</h2><div class="table"><table id="ivt"></table></div></div></section>
<section class="page" id="analysis"><div class="grid"><div class="card s12"><h2>مهندسی منو</h2><div class="table"><table id="at"></table></div></div><div class="card s6"><h2>سود و زیان</h2><div id="pnl"></div></div><div class="card s6"><h2>سناریوی سود</h2><div id="scenario"></div></div></div></section></main>
<div class="modal" id="modal"><div><h2>رسپی محصول</h2><div id="rows"></div><button onclick="addRow()">افزودن ماده</button><div class="form" style="margin-top:10px"><div><label>پرت رسپی %</label><input id="rw" type="number" value="3"></div><div><label>سربار هر سرو</label><input id="ro" type="number" value="0"></div><div><label>کارمزد %</label><input id="rf" type="number" value="0"></div><div><label>حاشیه سود هدف %</label><input id="rm" type="number" value="55"></div></div><div class="act"><button class="good" onclick="saveProd()">ذخیره</button><button onclick="modal.classList.remove('open')">انصراف</button></div></div></div><script src="app.js"></script></body></html>
